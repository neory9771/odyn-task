[program:odyn-mistral-sft2-research-1000]
command=/workspace/envs/hf/bin/python -u -m odyn_sft.run_management.cli train --config /dev/shm/odyn-mistral-sft2-research-1000/sft-oneepoch/one-epoch-config.json --disable-temperature-checks
directory=/dev/shm/odyn-mistral-sft2-research-1000/sft-oneepoch
environment=PYTHONUNBUFFERED="1",TOKENIZERS_PARALLELISM="false",HF_HOME="/dev/shm/odyn-mistral-model-cache",PYTHONPATH="/dev/shm/odyn-mistral-sft2-research-1000/sft-oneepoch/src"
autostart=false
autorestart=false
stopwaitsecs=180
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/shm/odyn-mistral-sft2-research-1000/train-oneepoch.log
stdout_logfile_maxbytes=20971520
stdout_logfile_backups=2
redirect_stderr=true
